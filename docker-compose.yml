services:
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./internal/observability/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # tempo API
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./internal/observability/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./internal/observability/loki.yaml:/etc/loki/loki.yaml
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

  payment-service-v1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-service-v1
    depends_on:
      - tempo
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_SERVICE_NAME=payment-service
      - PORT=${APP_PORT}
      - VERSION=1.0.0
    volumes:
      - ./payments.db:/app/payments.db
    logging:
      driver: "json-file"
    restart: unless-stopped

  payment-service-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-service-v2
    depends_on:
      - tempo
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_SERVICE_NAME=payment-service
      - PORT=${APP_PORT}
      - VERSION=2.0.0
    volumes:
      - ./payments.db:/app/payments.db
    logging:
      driver: "json-file"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - payment-service-v1
      - payment-service-v2
    restart: unless-stopped

volumes:
  grafana-storage: